<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Minha Carteira</title>
<style>
  :root{
    --bg:#0b1220; --card:#131c2e; --card2:#1a2540; --text:#e6edf7; --muted:#8a99b3;
    --line:#24314d; --red:#f26d6d; --redbg:rgba(242,109,109,.12); --green:#3ecf8e;
    --greenbg:rgba(62,207,142,.12); --accent:#14b8a6; --warn:#f5b84a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--text);
       padding-bottom:calc(72px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;border-bottom:1px solid var(--line)}
  header h1{font-size:18px;font-weight:600}
  header .sub{font-size:12px;color:var(--muted);margin-top:2px}
  main{padding:12px 14px}
  .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .muted{color:var(--muted)} .small{font-size:12px} .big{font-size:26px;font-weight:700}
  .neg{color:var(--red)} .pos{color:var(--green)} .warnc{color:var(--warn)}
  .pill{font-size:11px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted)}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .grid2 div{background:var(--card2);border-radius:10px;padding:8px 10px}
  .grid2 .l{font-size:11px;color:var(--muted)} .grid2 .v{font-size:15px;font-weight:600;margin-top:2px}
  .asset{border-left:4px solid transparent}
  .asset.loss{border-left-color:var(--red);background:linear-gradient(90deg,var(--redbg),var(--card) 40%)}
  .asset.gain{border-left-color:var(--green)}
  .tk{font-weight:700;font-size:16px}
  .nm{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
  .res{font-weight:700;text-align:right}
  .seg{display:flex;gap:6px;overflow-x:auto;margin:4px 0 10px;scrollbar-width:none}
  .seg button{flex:none;border:1px solid var(--line);background:transparent;color:var(--muted);
              padding:6px 12px;border-radius:99px;font-size:13px}
  .seg button.on{background:var(--accent);border-color:var(--accent);color:#04201d;font-weight:600}
  nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);
      padding-bottom:env(safe-area-inset-bottom);z-index:6}
  nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 0 12px;font-size:11px}
  nav button svg{display:block;margin:0 auto 3px;width:22px;height:22px}
  nav button.on{color:var(--accent)}
  .btn{background:var(--accent);color:#04201d;border:0;border-radius:10px;padding:11px 14px;font-weight:600;font-size:15px;width:100%}
  .btn.sec{background:var(--card2);color:var(--text)}
  input{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;
        padding:11px;font-size:16px;margin-top:6px}
  label{font-size:13px;color:var(--muted);display:block;margin-top:10px}
  .bar{height:6px;background:var(--card2);border-radius:4px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;background:var(--accent)}
  .note{font-size:12px;color:var(--muted);line-height:1.5}
  .alert{border:1px solid var(--warn);background:rgba(245,184,74,.08)}
  ul.chk{list-style:none;margin-top:8px} ul.chk li{font-size:13px;padding:5px 0;border-bottom:1px solid var(--line);line-height:1.4}
  ul.chk li:last-child{border:0}
  a{color:var(--accent)}
  .links{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .links a{font-size:13px;background:var(--card2);padding:6px 10px;border-radius:8px;text-decoration:none}
  dialog{background:var(--card);color:var(--text);border:0;border-radius:16px;padding:18px;width:min(92vw,420px);margin:auto}
  dialog::backdrop{background:rgba(0,0,0,.6)}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid var(--muted);border-top-color:transparent;border-radius:50%;animation:s .8s linear infinite;vertical-align:-2px}
  @keyframes s{to{transform:rotate(360deg)}}
  select{width:100%;background:var(--card2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px;font-size:16px;margin-top:6px}
</style>
</head>
<body>
<header>
  <div class="row">
    <div><h1 id="title">Carteira</h1><div class="sub" id="status">—</div></div>
    <button class="pill" id="refreshBtn" style="border:0;padding:8px 12px;font-size:13px">↻ Atualizar</button>
  </div>
</header>
<main id="view"></main>

<nav>
  <button data-tab="carteira" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M8 6V4h8v2"/></svg>Carteira</button>
  <button data-tab="indicadores"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Indicadores</button>
  <button data-tab="analise"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Análise</button>
  <button data-tab="config"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Ajustes</button>
</nav>

<dialog id="dlg"></dialog>

<script>
/* ======== Carteira inicial (extrato B3 19/11/2026 + prints Nu Invest 21/11/2026) ======== */
const DEFAULT = [
  // ticker, nome, classe, quantidade, preço médio, última cotação conhecida
  ["KLBN4","Klabin","Ação",786,3.56,3.33],
  ["BBAS3","Banco do Brasil","Ação",122,19.00,14.30],
  ["CMIG4","Cemig","Ação",29,11.14,10.95],
  ["AXIA3","Axia Energia","Ação",5,49.58,46.04],
  ["TAEE11","Taesa","Ação",4,39.24,40.19],
  ["WEGE3","WEG","Ação",3,42.35,50.71],
  ["TOTS3","Totvs","Ação",4,31.99,31.20],
  ["WRLD11","Investo FTSE Global Equities","ETF",1,140.89,158.06],
  ["URPR11","Urca Prime Renda","FII",122,38.33,15.75],
  ["HABT11","Habitat II","FII",17,69.29,57.80],
  ["MXRF11","Maxi Renda","FII",100,9.17,8.52],
  ["ARRI11","Átrio Reit Recebíveis","FII",245,null,3.01],
  ["VGHF11","Valora Hedge Fund","FII",169,6.65,3.87],
  ["JSAF11","JS Ativos Financeiros","FII",62,7.12,6.41],
  ["VGIR11","Valora RE III","FII",48,9.45,8.08],
  ["GARE11","Guardian Real Estate","FII",43,8.63,7.91],
  ["CYCR11","Cyrela Crédito","FII",42,8.26,7.95],
  ["VCRI11","Vinci Credit Securities","FII",31,7.07,6.48],
  ["SNAG11","Suno Agro","Fiagro",251,9.53,9.46],
  ["AAZQ11","AZ Quest Sole","Fiagro",360,7.68,5.50],
  ["XPCA11","XP Crédito Agrícola","Fiagro",232,7.49,6.47],
  ["VGIA11","Valora CRA","Fiagro",121,8.17,7.82],
  ["RURA11","Itaú Asset Rural","Fiagro",47,8.36,7.19],
  ["RZAG11","Riza Agro","Fiagro",42,8.71,7.45],
].map(([t,n,c,q,pm,p])=>({t,n,c,q,pm,p,chg:null,ts:null}));

const LS = 'carteira.v1';
let state = load();
let tab = 'carteira', filtro = 'Todos', ordem = 'resultado';
let loading = false;

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(LS));
    if (s && Array.isArray(s.ativos)) return s;
  }catch(e){}
  return {ativos: structuredClone(DEFAULT), token:'', lastUpdate:null};
}
function save(){ try{ localStorage.setItem(LS, JSON.stringify(state)); }catch(e){} }

/* ======== utilidades ======== */
const brl = v => v==null||isNaN(v) ? '—' : v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const pct = (v,d=2) => v==null||isNaN(v) ? '—' : (v>0?'+':'')+v.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d})+'%';
const num = v => v.toLocaleString('pt-BR');
const cls = v => v==null ? '' : v<0 ? 'neg' : v>0 ? 'pos' : '';
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function calc(a){
  const atual = a.q * a.p;
  const investido = a.pm!=null ? a.q * a.pm : null;
  const res = investido!=null ? atual - investido : null;
  const resPct = investido ? res / investido * 100 : null;
  const volta = a.pm!=null && a.p ? (a.pm / a.p - 1) * 100 : null; // quanto precisa subir p/ voltar ao PM
  return {atual, investido, res, resPct, volta};
}
function totais(lista){
  let atual=0, inv=0, invOk=true;
  lista.forEach(a=>{ const c=calc(a); atual+=c.atual; if(c.investido==null) invOk=false; else inv+=c.investido; });
  const semPM = lista.filter(a=>a.pm==null);
  const invComPM = lista.filter(a=>a.pm!=null).reduce((s,a)=>s+a.q*a.pm,0);
  const atualComPM = lista.filter(a=>a.pm!=null).reduce((s,a)=>s+a.q*a.p,0);
  return {atual, inv:invComPM, res:atualComPM-invComPM, resPct: invComPM? (atualComPM-invComPM)/invComPM*100 : null, semPM};
}

/* ======== cotações (brapi.dev) ======== */
async function fetchQuote(t, token){
  // tenta a API v2 (chave no cabeçalho) e, se falhar, a v1 (chave na URL)
  try{
    const r = await fetch(`https://brapi.dev/api/v2/stocks/quote?symbols=${encodeURIComponent(t)}`,
      {headers:{Authorization:`Bearer ${token}`}});
    if (r.ok){
      const j = await r.json(); const it = j.results && j.results[0]; const d = it && (it.data || it);
      if (d && d.regularMarketPrice!=null) return d;
    } else if (r.status===401 || r.status===429) throw new Error(r.status);
  }catch(e){ if (e.message==='401'||e.message==='429') throw e; }
  const r = await fetch(`https://brapi.dev/api/quote/${encodeURIComponent(t)}?token=${encodeURIComponent(token)}`);
  if (!r.ok) throw new Error(r.status);
  const j = await r.json(); const d = j.results && j.results[0];
  if (!d || d.regularMarketPrice==null) throw new Error('sem dados');
  return d;
}

async function atualizar(){
  if (loading) return;
  if (!state.token){ setStatus('Configure sua chave da brapi.dev em Ajustes'); go('config'); return; }
  loading = true; setStatus('<span class="spin"></span> Atualizando cotações…');
  let ok=0, falhas=[];
  const fila = [...state.ativos];
  async function worker(){
    while (fila.length){
      const a = fila.shift();
      try{
        const d = await fetchQuote(a.t, state.token);
        a.p = d.regularMarketPrice; a.chg = d.regularMarketChangePercent ?? null;
        a.ts = d.regularMarketTime || new Date().toISOString(); ok++;
      }catch(e){ falhas.push(a.t + (e.message==='401'?' (chave inválida)': e.message==='429'?' (limite)':'')); }
      render();
    }
  }
  await Promise.all([worker(),worker(),worker()]);
  loading = false;
  if (ok){ state.lastUpdate = new Date().toISOString(); save(); }
  setStatus(ok ? `Atualizado ${fmtHora(state.lastUpdate)}` + (falhas.length?` · falhou: ${falhas.join(', ')}`:'')
               : `Não foi possível atualizar (${falhas.slice(0,3).join(', ')}…)`);
  render();
}
function fmtHora(iso){ if(!iso) return 'nunca'; const d=new Date(iso);
  return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}); }
function setStatus(h){ document.getElementById('status').innerHTML = h; }

/* ======== telas ======== */
const CLASSES = ['Todos','Ação','FII','Fiagro','ETF'];
function segFiltro(){
  return `<div class="seg">${CLASSES.map(c=>`<button class="${c===filtro?'on':''}" onclick="filtro='${c}';render()">${c==='Ação'?'Ações':c==='FII'?'FIIs':c==='Fiagro'?'Fiagros':c}</button>`).join('')}</div>`;
}
function listaFiltrada(){ return state.ativos.filter(a=>filtro==='Todos'||a.c===filtro); }

function telaCarteira(){
  const T = totais(state.ativos);
  const L = listaFiltrada().slice().sort((a,b)=>{
    const A=calc(a), B=calc(b);
    if (ordem==='resultado') return (A.res??0)-(B.res??0);
    if (ordem==='pct') return (A.resPct??0)-(B.resPct??0);
    return B.atual-A.atual;
  });
  const emPrejuizo = state.ativos.filter(a=>{const c=calc(a);return c.res!=null&&c.res<0;});
  const somaPrej = emPrejuizo.reduce((s,a)=>s+calc(a).res,0);
  const TF = filtro==='Todos'?null:totais(listaFiltrada());
  return `
  <div class="card">
    <div class="small muted">Valor atual da carteira</div>
    <div class="big">${brl(T.atual)}</div>
    <div class="${cls(T.res)}" style="font-weight:600;margin-top:2px">${brl(T.res)} (${pct(T.resPct)}) <span class="small muted">sobre o investido</span></div>
    <div class="grid2">
      <div><div class="l">Investido (pelo preço médio)</div><div class="v">${brl(T.inv)}</div></div>
      <div><div class="l">Ativos no prejuízo</div><div class="v neg">${emPrejuizo.length} de ${state.ativos.length}</div></div>
      <div><div class="l">Soma dos prejuízos</div><div class="v neg">${brl(somaPrej)}</div></div>
      <div><div class="l">Soma dos lucros</div><div class="v pos">${brl(T.res - somaPrej)}</div></div>
    </div>
    ${T.semPM.length?`<div class="note warnc" style="margin-top:10px">Sem preço médio: ${T.semPM.map(a=>a.t).join(', ')} — toque no ativo para preencher (fica fora do cálculo de lucro/prejuízo).</div>`:''}
  </div>
  <div style="display:flex;gap:8px;margin-bottom:10px">
    <button class="btn" onclick="abrirOperacao('compra')">+ Registrar compra</button>
    <button class="btn sec" style="width:auto;padding:11px 16px" onclick="abrirOperacao('venda')">− Venda</button>
  </div>
  ${segFiltro()}
  ${TF?`<div class="card row small"><span class="muted">${filtro}: ${brl(TF.atual)}</span><span class="${cls(TF.res)}">${brl(TF.res)} (${pct(TF.resPct)})</span></div>`:''}
  <div class="seg">
    <button class="${ordem==='resultado'?'on':''}" onclick="ordem='resultado';render()">Maior prejuízo R$</button>
    <button class="${ordem==='pct'?'on':''}" onclick="ordem='pct';render()">Maior queda %</button>
    <button class="${ordem==='valor'?'on':''}" onclick="ordem='valor';render()">Maior posição</button>
  </div>
  ${L.map(a=>{const c=calc(a); const al=emAlerta(a); return `
    <div class="card asset ${c.res<0?'loss':c.res>0?'gain':''}" onclick="editar('${a.t}')">
      <div class="row">
        <div style="min-width:0"><div class="tk">${a.t} <span class="pill">${a.c}</span>${al?' <span class="pill" style="background:rgba(245,184,74,.18);color:var(--warn)">⚠ abaixo do PM</span>':''}${seloVeredito(a.t)}</div><div class="nm">${esc(a.n)}</div></div>
        <div class="res ${cls(c.res)}">${brl(c.res)}<div class="small">${pct(c.resPct)}</div></div>
      </div>
      <div class="row small muted" style="margin-top:8px">
        <span>${num(a.q)} × ${brl(a.p)}${a.chg!=null?` <span class="${cls(a.chg)}">(${pct(a.chg)} hoje)</span>`:''}</span>
        <span>PM ${brl(a.pm)}</span>
      </div>
      <div class="row small" style="margin-top:4px"><span class="muted">Valor atual</span><b>${brl(c.atual)}</b></div>
      ${al?`<button class="btn sec" style="margin-top:10px;padding:9px;font-size:14px;color:var(--warn)" onclick="event.stopPropagation();analisarClaude('${a.t}')">✦ Analisar com o Claude</button>`:''}
    </div>`}).join('')}
  <p class="note" style="text-align:center;margin:8px 0">Toque em um ativo para registrar compra/venda ou corrigir os valores.</p>`;
}

function telaIndicadores(){
  const T = totais(state.ativos);
  const porClasse = CLASSES.slice(1).map(c=>{
    const L=state.ativos.filter(a=>a.c===c); const t=totais(L);
    return {c, n:L.length, atual:t.atual, res:t.res, resPct:t.resPct, peso:t.atual/T.atual*100};
  }).filter(x=>x.n);
  const L = state.ativos.map(a=>({a, c:calc(a), peso:calc(a).atual/T.atual*100})).sort((x,y)=>y.peso-x.peso);
  const top5 = L.slice(0,5).reduce((s,x)=>s+x.peso,0);
  const pequenos = L.filter(x=>x.peso<2).length;
  const alertas = [];
  if (top5>50) alertas.push(`As 5 maiores posições somam ${pct(top5,1).replace('+','')} da carteira.`);
  const credito = porClasse.filter(x=>x.c==='FII'||x.c==='Fiagro').reduce((s,x)=>s+x.peso,0);
  if (credito>60) alertas.push(`${pct(credito,1).replace('+','')} está em FIIs/Fiagros — a maioria de crédito (CRI/CRA), sensíveis a juros e inadimplência.`);
  if (pequenos>5) alertas.push(`${pequenos} ativos têm menos de 2% da carteira cada.`);
  const fundo = L.filter(x=>x.c.resPct!=null&&x.c.resPct<-30).map(x=>x.a.t);
  if (fundo.length) alertas.push(`Queda acima de 30% sobre o preço médio: ${fundo.join(', ')}.`);
  return `
  ${alertas.length?`<div class="card alert"><b class="warnc">Pontos de atenção</b><ul class="chk">${alertas.map(x=>`<li>${x}</li>`).join('')}</ul></div>`:''}
  <div class="card"><b>Por classe</b>
    ${porClasse.map(x=>`
      <div style="margin-top:12px">
        <div class="row small"><span>${x.c} <span class="muted">(${x.n})</span></span><span>${brl(x.atual)} · <b>${x.peso.toFixed(1).replace('.',',')}%</b></span></div>
        <div class="bar"><i style="width:${x.peso}%"></i></div>
        <div class="small ${cls(x.res)}" style="margin-top:3px">${brl(x.res)} (${pct(x.resPct)})</div>
      </div>`).join('')}
  </div>
  <div class="card"><b>Cada ativo</b>
    <div class="note" style="margin-top:4px">"Para voltar ao PM" é quanto a cotação precisa subir para você empatar.</div>
    ${L.map(x=>`
      <div style="padding:10px 0;border-bottom:1px solid var(--line)">
        <div class="row"><b>${x.a.t}</b><span class="small">peso ${x.peso.toFixed(1).replace('.',',')}%</span></div>
        <div class="bar"><i style="width:${Math.min(100,x.peso*4)}%"></i></div>
        <div class="row small muted" style="margin-top:5px">
          <span>Hoje: <span class="${cls(x.a.chg)}">${pct(x.a.chg)}</span></span>
          <span>vs PM: <span class="${cls(x.c.resPct)}">${pct(x.c.resPct)}</span></span>
          <span>${x.c.volta>0?`p/ voltar ao PM: <span class="warnc">${pct(x.c.volta,1)}</span>`:x.c.volta!=null?'<span class="pos">acima do PM</span>':''}</span>
        </div>
      </div>`).join('')}
  </div>`;
}

let anaSel = null, anaQtd = '';
function telaAnalise(){
  const T = totais(state.ativos);
  const opts = state.ativos.map(a=>`<option value="${a.t}" ${a.t===anaSel?'selected':''}>${a.t} — ${esc(a.n)}</option>`).join('');
  let corpo = '<p class="note">Escolha um ativo para ver os dados e simular uma compra.</p>';
  const a = state.ativos.find(x=>x.t===anaSel);
  if (a){

/* ======== veredito automático (arquivo analises.json, gerado pelo Claude) ======== */
const SINAIS = {
  favoravel:   {txt:'Favorável a comprar', ico:'🟢', cor:'var(--green)', bg:'var(--greenbg)'},
  neutro:      {txt:'Neutro / aguardar',   ico:'🟡', cor:'var(--warn)',  bg:'rgba(245,184,74,.14)'},
  desfavoravel:{txt:'Desfavorável agora',  ico:'🔴', cor:'var(--red)',   bg:'var(--redbg)'}
};
async function carregarAnalises(){
  try{
    const r = await fetch('analises.json?t=' + Date.now(), {cache:'no-store'});
    if (!r.ok) return;
    const j = await r.json();
    if (j && j.ativos){ state.analises = j; save(); render(); }
  }catch(e){}
}
function veredito(t){ const v = state.analises && state.analises.ativos && state.analises.ativos[t]; return v && SINAIS[v.sinal] ? v : null; }
function seloVeredito(t){
  const v = veredito(t); if (!v) return '';
  const s = SINAIS[v.sinal];
  return ` <span class="pill" style="background:${s.bg};color:${s.cor};font-weight:600">${s.ico} ${s.txt}</span>`;
}
function cardVeredito(a){
  const v = veredito(a.t);
  if (!v) return `<div class="card"><b>Veredito</b><p class="note" style="margin-top:6px">Ainda sem análise automática para ${a.t}. Ela aparece aqui depois da próxima rodada de análises.</p></div>`;
  const s = SINAIS[v.sinal];
  const mov = v.cotacao && a.p ? (a.p / v.cotacao - 1) * 100 : null;
  const velho = mov!=null && Math.abs(mov) >= 10;
  return `<div class="card" style="border:1px solid ${s.cor};background:${s.bg}">
    <div class="row"><b style="color:${s.cor};font-size:17px">${s.ico} ${s.txt}</b><span class="small muted">${v.data.split('-').reverse().join('/')}</span></div>
    <p class="note" style="margin-top:8px;color:var(--text)">${esc(v.resumo)}</p>
    ${v.origem?`<p class="small muted" style="margin-top:6px">Queda vem ${v.origem==='mercado'?'principalmente do <b>mercado em geral</b>':v.origem==='proprio'?'principalmente do <b>próprio ativo</b>':'do <b>mercado e do próprio ativo</b>'}.</p>`:''}
    ${v.motivos&&v.motivos.length?`<ul class="chk">${v.motivos.map(m=>`<li>${esc(m)}</li>`).join('')}</ul>`:''}
    <p class="small muted" style="margin-top:6px">Cotação na análise: ${brl(v.cotacao)}${mov!=null?` · hoje ${pct(mov,1)}`:''}</p>
    ${velho?`<p class="small warnc" style="margin-top:4px">⚠ O preço mudou bastante desde a análise — ela pode estar desatualizada.</p>`:''}
  </div>`;
}

/* ======== alerta + análise no Claude ======== */
function gatilho(){ return state.gatilho ?? 1; } // % abaixo do preço médio
function emAlerta(a){ const c=calc(a); return c.resPct!=null && c.resPct <= -gatilho(); }
function promptAnalise(a){
  const c = calc(a), T = totais(state.ativos), peso = c.atual/T.atual*100;
  const f = v => v.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  return `Analise ${a.t} (${a.n}, ${a.c}) na minha carteira.\n\n`
   + `Minha posição: ${a.q} cotas/ações, preço médio R$ ${f(a.pm)}, cotação atual R$ ${f(a.p)} `
   + `(${f(c.resPct)}% vs meu preço médio; resultado R$ ${f(c.res)}). Peso na carteira: ${f(peso)}% de R$ ${f(T.atual)}.\n\n`
   + `1) Pesquise na web e explique POR QUE ele caiu: notícias, fatos relevantes, dividendos/rendimentos recentes, `
   + `relatório gerencial (se for fundo), resultados (se for ação) e o cenário (Selic, inflação, setor).\n`
   + `2) Diga se a queda parece vir do mercado em geral ou de um problema do próprio ativo.\n`
   + `3) Liste os argumentos a favor e contra eu comprar mais agora para baixar o preço médio, `
   + `e mostre como ficaria meu preço médio e meu peso comprando 10% e 25% a mais de cotas.\n`
   + `4) Feche com um resumo curto do que pesa mais.`;
}
async function analisarClaude(t){
  const a = state.ativos.find(x=>x.t===t); const txt = promptAnalise(a);
  try{ await navigator.clipboard.writeText(txt); }catch(e){}
  const url = 'https://claude.ai/new?q=' + encodeURIComponent(txt);
  const d = document.getElementById('dlg');
  d.innerHTML = `<b>Analisar ${a.t} com o Claude</b>
    <p class="note" style="margin-top:8px">A pergunta já foi copiada. Toque em <b>Abrir o Claude</b>; se ela não aparecer escrita lá, é só colar (segurar no campo → Colar) e enviar.</p>
    <textarea readonly style="width:100%;height:160px;margin-top:10px;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:13px">${esc(txt)}</textarea>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn sec" onclick="document.getElementById('dlg').close()">Fechar</button>
      <a class="btn" style="text-align:center;text-decoration:none" href="${url}" target="_blank" rel="noopener">Abrir o Claude</a>
    </div>`;
  d.showModal();
}

/* ======== compras e vendas ======== */
const hoje = () => { const d=new Date(); return new Date(d-d.getTimezoneOffset()*60000).toISOString().slice(0,10); };
function abrirOperacao(tipo, tk){
  const d = document.getElementById('dlg');
  const venda = tipo==='venda';
  const opts = state.ativos.slice().sort((a,b)=>a.t.localeCompare(b.t))
    .map(a=>`<option value="${a.t}" ${a.t===tk?'selected':''}>${a.t} — ${esc(a.n)}</option>`).join('');
  d.innerHTML = `
    <b style="font-size:17px">${venda?'Registrar venda':'Registrar compra'}</b>
    <label>Ativo</label>
    <select id="op_t" onchange="document.getElementById('op_novo').style.display=this.value==='__novo'?'block':'none';prevOp()">
      ${opts}${venda?'':'<option value="__novo">+ Ativo novo (que ainda não tenho)</option>'}
    </select>
    <div id="op_novo" style="display:none">
      <label>Ticker</label><input id="op_nt" placeholder="ex.: ITSA4" autocapitalize="characters">
      <label>Nome</label><input id="op_nn" placeholder="ex.: Itaúsa">
      <label>Classe</label><select id="op_nc">${CLASSES.slice(1).map(c=>`<option>${c}</option>`).join('')}</select>
    </div>
    <label>Quantidade ${venda?'vendida':'comprada'}</label>
    <input id="op_q" type="number" inputmode="numeric" min="1" oninput="prevOp()">
    <label>Preço por cota/ação (R$)</label>
    <input id="op_p" type="text" inputmode="decimal" placeholder="ex.: 9,45" oninput="prevOp()">
    <label>Data</label><input id="op_d" type="date" value="${hoje()}">
    <div id="op_prev" class="note" style="margin-top:10px"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn sec" onclick="document.getElementById('dlg').close()">Cancelar</button>
      <button class="btn" onclick="salvarOp('${tipo}')">${venda?'Registrar venda':'Registrar compra'}</button>
    </div>`;
  d.showModal();
  if (tk==null && !venda) document.getElementById('op_t').value = state.ativos[0].t;
  prevOp();
}
function prevOp(){
  const el = document.getElementById('op_prev'); if(!el) return;
  const t = document.getElementById('op_t').value;
  const q = parseInt(document.getElementById('op_q').value)||0;
  const p = pnum(document.getElementById('op_p').value);
  const a = state.ativos.find(x=>x.t===t);
  const venda = document.querySelector('#dlg b').textContent.includes('venda');
  if (!q || !p){ el.innerHTML = a ? `Hoje você tem <b>${num(a.q)}</b> · preço médio <b>${brl(a.pm)}</b>` : ''; return; }
  if (venda){
    if (!a) return;
    const lucro = a.pm!=null ? (p - a.pm)*q : null;
    el.innerHTML = `Total recebido: <b>${brl(q*p)}</b><br>Fica com <b>${num(Math.max(0,a.q-q))}</b> · preço médio não muda (${brl(a.pm)})`
      + (lucro!=null?`<br>Resultado desta venda: <b class="${cls(lucro)}">${brl(lucro)}</b>`:'')
      + (q>a.q?`<br><span class="neg">Você só tem ${num(a.q)}.</span>`:'');
  } else {
    const novoQ = (a?a.q:0)+q;
    const novoPM = a && a.pm!=null ? (a.q*a.pm + q*p)/novoQ : p;
    el.innerHTML = `Total pago: <b>${brl(q*p)}</b><br>Passa a ter <b>${num(novoQ)}</b> · novo preço médio <b>${brl(novoPM)}</b>`
      + (a&&a.pm!=null?` <span class="muted">(antes ${brl(a.pm)})</span>`:'');
  }
}
function salvarOp(tipo){
  let t = document.getElementById('op_t').value;
  const q = parseInt(document.getElementById('op_q').value)||0;
  const p = pnum(document.getElementById('op_p').value);
  const data = document.getElementById('op_d').value || hoje();
  if (!q || !p){ alert('Preencha quantidade e preço.'); return; }
  let a;
  if (t==='__novo'){
    t = document.getElementById('op_nt').value.trim().toUpperCase();
    if (!t){ alert('Informe o ticker.'); return; }
    a = state.ativos.find(x=>x.t===t);
    if (!a){
      a = {t, n:document.getElementById('op_nn').value.trim()||t, c:document.getElementById('op_nc').value, q:0, pm:null, p, chg:null, ts:null};
      state.ativos.push(a);
    }
  } else a = state.ativos.find(x=>x.t===t);
  const antes = {q:a.q, pm:a.pm};
  if (tipo==='venda'){
    if (q > a.q){ alert(`Você só tem ${a.q}.`); return; }
    a.q -= q; // preço médio não muda na venda
  } else {
    a.pm = a.pm!=null && a.q>0 ? (a.q*a.pm + q*p)/(a.q+q) : p;
    a.q += q;
  }
  state.ops = state.ops || [];
  state.ops.unshift({id:Date.now(), tipo, t, q, p, data, antes});
  if (tipo==='venda' && a.q===0 && confirm(`Você zerou ${t}. Tirar da lista da carteira?`))
    state.ativos = state.ativos.filter(x=>x!==a);
  save(); document.getElementById('dlg').close(); render();
  if (!a.chg && state.token) atualizar();
}
function desfazerOp(id){
  const i = (state.ops||[]).findIndex(o=>o.id===id); if (i<0) return;
  const o = state.ops[i];
  if (i!==0 && !confirm('Esta não é a última operação deste app. Desfazer mesmo assim? O preço médio volta ao que era antes dela.')) return;
  let a = state.ativos.find(x=>x.t===o.t);
  if (!a){ a = {t:o.t, n:o.t, c:'Ação', q:0, pm:null, p:o.p, chg:null, ts:null}; state.ativos.push(a); }
  a.q = o.antes.q; a.pm = o.antes.pm;
  if (a.q===0 && o.tipo==='compra') state.ativos = state.ativos.filter(x=>x!==a);
  state.ops.splice(i,1); save(); render();
}
function telaHistorico(){
  const ops = state.ops||[];
  if (!ops.length) return '<p class="note">Nenhuma compra ou venda registrada ainda.</p>';
  return ops.map(o=>`
    <div class="row small" style="padding:9px 0;border-bottom:1px solid var(--line)">
      <div><b class="${o.tipo==='venda'?'neg':'pos'}">${o.tipo==='venda'?'Venda':'Compra'}</b> ${o.t}<br>
        <span class="muted">${o.data.split('-').reverse().join('/')} · ${num(o.q)} × ${brl(o.p)} = ${brl(o.q*o.p)}</span></div>
      <button class="pill" style="border:0" onclick="if(confirm('Desfazer esta ${o.tipo}?'))desfazerOp(${o.id})">Desfazer</button>
    </div>`).join('');
}

const pnum = s => { s=String(s).trim().replace(/\./g,'').replace(',','.'); const v=parseFloat(s); return isNaN(v)?null:v; };
function salvarEd(t){

function novoAtivo(){

function addAtivo(){

/* ======== navegação ======== */
const TITLES = {carteira:'Carteira', indicadores:'Indicadores', analise:'Análise', config:'Ajustes'};
function go(t){ tab=t; document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t)); render(); scrollTo(0,0); }
function render(keepFocus){
  if (keepFocus){ // não redesenha o campo enquanto digita na simulação
    const inp = document.activeElement; const pos = inp && inp.selectionStart;
    document.getElementById('view').innerHTML = telaAnalise();
    const n = document.querySelector('#view input[type=number]'); if(n){ n.focus(); try{n.setSelectionRange(pos,pos)}catch(e){} }
    return;
  }
  document.getElementById('title').textContent = TITLES[tab];
  document.getElementById('view').innerHTML =
    tab==='carteira'?telaCarteira(): tab==='indicadores'?telaIndicadores(): tab==='analise'?telaAnalise(): telaConfig();
}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));
document.getElementById('refreshBtn').onclick = atualizar;

setStatus(state.lastUpdate ? `Atualizado ${fmtHora(state.lastUpdate)}` : 'Cotações de 21/11 (toque em Atualizar)');
render();
carregarAnalises();
if (state.token) atualizar();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
